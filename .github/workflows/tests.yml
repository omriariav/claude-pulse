name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # macOS runner matches the script's real target: bash 3.2 + BSD tooling
    # (the suite uses BSD `sed -i ''` and `tail -r`, which differ on Linux).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Configure git identity
        # test_statusline.sh creates commits in temp repos; a clean runner has
        # no global git identity, which would fail with "Author identity unknown".
        run: |
          git config --global user.email "ci@claude-pulse.test"
          git config --global user.name "claude-pulse CI"

      - name: Run test suite
        run: bash tests/run_tests.sh
